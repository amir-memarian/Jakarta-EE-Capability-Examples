<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سیستم مدیریت بانک - Jakarta JPA Hibernate</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .content {
            padding: 30px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .section {
            margin-bottom: 40px;
        }

        .section h2 {
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .form-group {
            display: inline-block;
            margin: 10px;
        }

        input, select, button {
            padding: 10px;
            margin: 5px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            background: #764ba2;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th, td {
            padding: 12px;
            text-align: right;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #667eea;
            color: white;
        }

        tr:hover {
            background: #f5f5f5;
        }

        .delete-btn {
            background: #dc3545;
            padding: 5px 10px;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #c82333;
        }

        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
        }

        .message.success {
            background: #28a745;
        }

        .message.error {
            background: #dc3545;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        @media (max-width: 768px) {
            .form-group {
                display: block;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>🏦 سیستم مدیریت بانک</h1>
        <p>Jakarta EE 11 + JPA + Hibernate + Connection Pool</p>
        <p style="font-size: 12px; margin-top: 10px;">One-to-One | One-to-Many | Many-to-Many</p>
    </div>

    <div class="content">
        <!-- آمار -->
        <div class="stats" id="stats">
            <div class="stat-card">
                <h3 id="totalCustomers">0</h3>
                <p>تعداد مشتریان</p>
            </div>
            <div class="stat-card">
                <h3 id="totalAccounts">0</h3>
                <p>تعداد حساب‌ها</p>
            </div>
            <div class="stat-card">
                <h3 id="totalBalance">0</h3>
                <p>جمع کل موجودی</p>
            </div>
        </div>

        <!-- فرم افزودن مشتری -->
        <div class="section">
            <h2>➕ افزودن مشتری جدید</h2>
            <form id="customerForm">
                <div class="form-group">
                    <input type="text" id="fullName" placeholder="نام کامل" required>
                </div>
                <div class="form-group">
                    <input type="email" id="email" placeholder="ایمیل">
                </div>
                <div class="form-group">
                    <input type="text" id="phone" placeholder="تلفن">
                </div>
                <button type="submit">افزودن مشتری</button>
            </form>
        </div>

        <!-- لیست مشتریان -->
        <div class="section">
            <h2>👥 لیست مشتریان</h2>
            <div id="customersList">
                <div class="loading">در حال بارگذاری...</div>
            </div>
        </div>

        <!-- فرم افتتاح حساب -->
        <div class="section">
            <h2>💳 افتتاح حساب جدید</h2>
            <form id="accountForm">
                <div class="form-group">
                    <select id="customerId" required></select>
                </div>
                <div class="form-group">
                    <input type="text" id="accountNumber" placeholder="شماره حساب" required>
                </div>
                <div class="form-group">
                    <select id="accountType">
                        <option value="SAVINGS">حساب پس‌انداز</option>
                        <option value="CHECKING">حساب جاری</option>
                        <option value="BUSINESS">حساب تجاری</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="initialBalance" placeholder="موجودی اولیه" value="0">
                </div>
                <button type="submit">افتتاح حساب</button>
            </form>
        </div>

        <!-- لیست حساب‌ها -->
        <div class="section">
            <h2>💰 لیست حساب‌های بانکی</h2>
            <div id="accountsList">
                <div class="loading">در حال بارگذاری...</div>
            </div>
        </div>
    </div>
</div>

<script>
    const contextPath = window.location.pathname.substring(0, window.location.pathname.indexOf('/', 1));
    const apiBase = contextPath + '/api';

    // نمایش پیام
    function showMessage(msg, type) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${type}`;
        messageDiv.textContent = msg;
        document.body.appendChild(messageDiv);
        setTimeout(() => messageDiv.remove(), 3000);
    }

    // بارگذاری آمار
    async function loadStats() {
        try {
            const response = await fetch(`${apiBase}/customers`);
            const result = await response.json();
            if (result.success) {
                document.getElementById('totalCustomers').textContent = result.data.length;
            }

            const accountsResponse = await fetch(`${apiBase}/accounts`);
            const accountsResult = await accountsResponse.json();
            if (accountsResult.success) {
                document.getElementById('totalAccounts').textContent = accountsResult.data.length;
                const total = accountsResult.data.reduce((sum, acc) => sum + acc.balance, 0);
                document.getElementById('totalBalance').textContent = total.toLocaleString() + ' تومان';
            }
        } catch (error) {
            console.error('Error loading stats:', error);
        }
    }

    // بارگذاری مشتریان
    async function loadCustomers() {
        try {
            const response = await fetch(`${apiBase}/customers`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                const customers = result.data;
                const customerSelect = document.getElementById('customerId');
                customerSelect.innerHTML = '<option value="">انتخاب مشتری</option>' +
                    customers.map(c => `<option value="${c.id}">${c.fullName}</option>`).join('');

                const html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>نام کامل</th>
                                    <th>ایمیل</th>
                                    <th>تلفن</th>
                                    <th>تعداد حساب‌ها</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${customers.map(customer => `
                                    <tr>
                                        <td>${customer.id}</td>
                                        <td>${customer.fullName}</td>
                                        <td>${customer.email || '-'}</td>
                                        <td>${customer.phone || '-'}</td>
                                        <td>${customer.accounts ? customer.accounts.length : 0}</td>
                                        <td>
                                            <button class="delete-btn" onclick="deleteCustomer(${customer.id})">حذف</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                document.getElementById('customersList').innerHTML = html;
            } else {
                document.getElementById('customersList').innerHTML = '<p style="text-align: center;">هیچ مشتری یافت نشد</p>';
            }
        } catch (error) {
            console.error('Error loading customers:', error);
            document.getElementById('customersList').innerHTML = '<p style="text-align: center; color: red;">خطا در بارگذاری مشتریان</p>';
        }
    }

    // بارگذاری حساب‌ها
    async function loadAccounts() {
        try {
            const response = await fetch(`${apiBase}/accounts`);
            const result = await response.json();

            if (result.success && result.data.length > 0) {
                const accounts = result.data;
                const html = `
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>شماره حساب</th>
                                    <th>نوع حساب</th>
                                    <th>موجودی</th>
                                    <th>نام مشتری</th>
                                    <th>عملیات</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${accounts.map(account => `
                                    <tr>
                                        <td>${account.id}</td>
                                        <td>${account.accountNumber}</td>
                                        <td>${account.accountType}</td>
                                        <td>${account.balance.toLocaleString()} تومان</td>
                                        <td>${account.customer?.fullName || '-'}</td>
                                        <td>
                                            <button class="delete-btn" onclick="deleteAccount(${account.id})">حذف</button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                document.getElementById('accountsList').innerHTML = html;
            } else {
                document.getElementById('accountsList').innerHTML = '<p style="text-align: center;">هیچ حسابی یافت نشد</p>';
            }
        } catch (error) {
            console.error('Error loading accounts:', error);
            document.getElementById('accountsList').innerHTML = '<p style="text-align: center; color: red;">خطا در بارگذاری حساب‌ها</p>';
        }
    }

    // حذف مشتری
    async function deleteCustomer(id) {
        if (!confirm('آیا از حذف این مشتری مطمئن هستید؟')) return;

        try {
            const response = await fetch(`${apiBase}/customers/${id}`, {
                method: 'DELETE'
            });
            const result = await response.json();

            if (result.success) {
                showMessage('مشتری با موفقیت حذف شد', 'success');
                loadCustomers();
                loadStats();
            } else {
                showMessage(result.message || 'خطا در حذف مشتری', 'error');
            }
        } catch (error) {
            showMessage('خطا در ارتباط با سرور', 'error');
        }
    }

    // حذف حساب
    async function deleteAccount(id) {
        if (!confirm('آیا از حذف این حساب مطمئن هستید؟')) return;

        try {
            const response = await fetch(`${apiBase}/accounts/${id}`, {
                method: 'DELETE'
            });
            const result = await response.json();

            if (result.success) {
                showMessage('حساب با موفقیت حذف شد', 'success');
                loadAccounts();
                loadStats();
            } else {
                showMessage(result.message || 'خطا در حذف حساب', 'error');
            }
        } catch (error) {
            showMessage('خطا در ارتباط با سرور', 'error');
        }
    }

    // افزودن مشتری
    document.getElementById('customerForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const customer = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            phone: document.getElementById('phone').value
        };

        try {
            const response = await fetch(`${apiBase}/customers`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(customer)
            });
            const result = await response.json();

            if (result.success) {
                showMessage('مشتری با موفقیت اضافه شد', 'success');
                document.getElementById('customerForm').reset();
                loadCustomers();
                loadStats();
            } else {
                showMessage(result.message || 'خطا در افزودن مشتری', 'error');
            }
        } catch (error) {
            showMessage('خطا در ارتباط با سرور', 'error');
        }
    });

    // افتتاح حساب
    document.getElementById('accountForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const account = {
            accountNumber: document.getElementById('accountNumber').value,
            accountType: document.getElementById('accountType').value,
            balance: parseFloat(document.getElementById('initialBalance').value),
            customerId: parseInt(document.getElementById('customerId').value)
        };

        if (!account.customerId) {
            showMessage('لطفاً مشتری را انتخاب کنید', 'error');
            return;
        }

        try {
            const response = await fetch(`${apiBase}/accounts`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(account)
            });
            const result = await response.json();

            if (result.success) {
                showMessage('حساب با موفقیت ایجاد شد', 'success');
                document.getElementById('accountForm').reset();
                loadAccounts();
                loadCustomers();
                loadStats();
            } else {
                showMessage(result.message || 'خطا در ایجاد حساب', 'error');
            }
        } catch (error) {
            showMessage('خطا در ارتباط با سرور', 'error');
        }
    });

    // بارگذاری اولیه
    loadCustomers();
    loadAccounts();
    loadStats();

    // تابع global برای دکمه‌ها
    window.deleteCustomer = deleteCustomer;
    window.deleteAccount = deleteAccount;
</script>
</body>
</html>
